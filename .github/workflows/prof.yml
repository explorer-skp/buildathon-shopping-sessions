name: prof
on:
  workflow_dispatch:
  push:
    branches: [prof]
jobs:
  prof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) >/dev/null 2>&1 || sudo apt-get install -y -qq linux-tools-azure >/dev/null 2>&1
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version; nproc; lscpu | grep "Model name"
      - name: Data
        run: |
          curl -fsSLO https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          unzip -q generator.zip
          G=$(dirname $(find . -name Cargo.toml -path '*generator*' | head -1))
          (cd $G && cargo build --release -q)
          $G/target/release/generate --seed 7 --events 20000000 --clicks 5000000 --output data
      - name: Build
        run: RUSTFLAGS="-C target-cpu=x86-64-v3" CARGO_PROFILE_RELEASE_DEBUG=line-tables-only cargo build --release -q --features prof
      - name: Profile
        run: |
          B=target/release/sessions
          for i in 1 2; do rm -rf out; env NCPU=4 SS_QUIET=1 DATA_DIR=data OUTPUT_DIR=out $B; done
          rm -rf out; env NCPU=4 SS_LOG=1 DATA_DIR=data OUTPUT_DIR=out $B
          rm -rf out; perf stat -e task-clock,page-faults,context-switches,cycles,instructions,branch-misses,cache-misses,dTLB-load-misses -- env NCPU=4 SS_QUIET=1 DATA_DIR=data OUTPUT_DIR=out $B 2>&1 | grep -vE "^$|Performance"
          rm -rf out; perf record -F 3999 -o perf.data -- env NCPU=4 SS_QUIET=1 DATA_DIR=data OUTPUT_DIR=out $B 2>&1 | tail -1
          perf report -i perf.data --no-children --sort symbol --percent-limit 0.5 --stdio 2>/dev/null | grep -vE "^#|^$" | cut -c1-150 | head -60
          echo "--- hot source lines"
          timeout 400 perf report -i perf.data --no-children --sort srcline --percent-limit 0.15 --stdio 2>/dev/null | grep -vE "^#|^$" | grep -E "scan.rs|ts.rs|main.rs|h.rs|swc.rs" | cut -c1-110 | head -60
          echo "--- SS_NOBUMP=1"
          rm -rf out; SS_NOBUMP=1 perf stat -e task-clock,page-faults -- env NCPU=4 SS_QUIET=1 DATA_DIR=data OUTPUT_DIR=out $B 2>&1 | grep -E "task-clock|page-faults|elapsed"
