name: bench
on: [workflow_dispatch, push]
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          nproc; free -g | head -2; lscpu | grep -E "Model name|Flags" | cut -c1-200
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag
      - name: Build image
        run: docker build --platform linux/amd64 -t entry .
      - name: Build the previous commit's image
        run: |
          P=HEAD~1; [ -f bench_prev.txt ] && P=$(cat bench_prev.txt)
          git worktree add -q ../prev $P
          docker build --platform linux/amd64 -t prev ../prev
      - name: Make a 20M-event dataset
        run: |
          curl -fsSLO https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          unzip -q generator.zip
          G=$(dirname $(find . -name Cargo.toml -path '*generator*' | head -1))
          (cd $G && cargo build --release -q)
          $G/target/release/generate --seed 7 --events 20000000 --clicks 5000000 --output data
          du -sh data
      - name: Time runs
        run: |
          mkdir -p scratch && chmod 777 scratch
          run() {
            sudo rm -rf out && mkdir out && chmod 777 out
            img=$1; lab=$2; shift 2
            s=$(date +%s.%N)
            docker run --rm --network none --user 1000:1000 --read-only --tmpfs /tmp:rw,size=64m \
              -e NCPU=$(nproc) -e MEM_GB=12 "$@" -v $PWD/data:/data:ro -v $PWD/out:/output -v $PWD/scratch:/scratch $img
            e=$(date +%s.%N)
            echo "$lab: $(echo "$e - $s" | bc) s"
          }
          for i in 1 2 3 4; do run prev "A(prev)"; run entry "B"; done
          # optional switch A/B on the new image, set in bench_ab.txt as: label env-args
          if [ -f bench_ab.txt ] && [ "$(cat bench_ab.txt)" != none ]; then read -r LAB ARGS < bench_ab.txt; for i in 1 2 3; do run entry "C($LAB)" $ARGS; run entry "B2"; done; fi
          for i in 1 2 3; do s=$(date +%s.%N); docker run --rm --network none --user 1000:1000 --read-only entry /bin/true; e=$(date +%s.%N); echo "empty container: $(echo "$e - $s" | bc) s"; done
          sudo rm -rf out && mkdir out && chmod 777 out
          docker run --rm --user 1000:1000 -e NCPU=$(nproc) -e SS_LOG=1 -v $PWD/data:/data:ro -v $PWD/out:/output entry /usr/local/bin/sessions 2>&1 | tail -12
      - name: Exit cost (native run)
        run: |
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release -q 2>/dev/null || true
          for i in 1 2; do sudo rm -rf outn && mkdir outn; s=$(date +%s.%N); env NCPU=$(nproc) SS_LOG=1 DATA_DIR=data OUTPUT_DIR=outn target/release/sessions 2>&1 | grep -E "done"; e=$(date +%s.%N); echo "process wall $(echo "$e - $s" | bc) s"; done
      - name: Compare with a known-good build on x86
        run: |
          git worktree add -q ../ref 57fb1f3094ccb8235fe30e3abb35b37ce8e32e43
          (cd ../ref && RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release -q)
          sudo rm -rf out-ref out-new && mkdir out-ref out-new && chmod 777 out-new
          env NCPU=$(nproc) SS_QUIET=1 DATA_DIR=data OUTPUT_DIR=out-ref ../ref/target/release/sessions
          docker run --rm --user 1000:1000 -e NCPU=$(nproc) -v $PWD/data:/data:ro -v $PWD/out-new:/output entry
          pip install -q polars
          python3 tools/pqdiff.py out-ref out-new
